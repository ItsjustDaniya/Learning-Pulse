name: Learning Pulse sync

on:
  schedule:
    # Once a day at 06:47 IST (01:17 UTC). GitHub cron is always UTC.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch + report, don't write to the sheet)"
        type: boolean
        default: false

concurrency:
  group: learning-pulse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync Metabase -> Learning Pulse Live
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync_learning_pulse.py ${{ inputs.dry_run && '--dry-run' || '' }}
